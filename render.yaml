services:
  - type: web
    name: fraud-sentinel-frontend
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm exec vite build
    staticPublishPath: dist/public
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
