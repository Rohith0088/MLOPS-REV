services:
  - type: web
    name: fraud-sentinel-backend
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/trpc/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_AUTH_ENABLED
        value: "false"

  - type: static
    name: fraud-sentinel-frontend
    runtime: static
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm exec vite build
    staticPublishPath: dist/public
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
